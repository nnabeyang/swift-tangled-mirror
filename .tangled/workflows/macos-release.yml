when:
  - event: ["manual"]

engine: "agent"
platform: "macos"
executor: "virtual-machine"
xcode: "26.6"

clone:
  submodules: false
  tags: true

steps:
  - name: "Build release artifact"
    command: |
      set -euo pipefail

      action="${TANGLED_INPUT_ACTION:-}"
      version="${TANGLED_INPUT_VERSION:-}"
      case "$action" in
        verify|publish) ;;
        *)
          echo "TANGLED_INPUT_ACTION must be verify or publish" >&2
          exit 64
          ;;
      esac
      if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "TANGLED_INPUT_VERSION must use MAJOR.MINOR.PATCH" >&2
        exit 64
      fi
      test "$(git cat-file -t "$version")" = "tag"

      tag_commit="$(git rev-parse "$version^{commit}")"
      if [[ "$action" == "publish" ]]; then
        test "${TANGLED_REF_TYPE:-}" = "tag"
        test "${TANGLED_REF:-}" = "refs/tags/$version"
        test "${TANGLED_REF_NAME:-}" = "$version"
        test "${TANGLED_COMMIT_SHA:-}" = "$tag_commit"
      fi

      ./build-release.sh "$version"

      artifact=".build/releases/$version/tng-$version-macos-arm64.tar.gz"
      checksum="$artifact.sha256"
      test -f "$artifact"
      test -f "$checksum"
      printf 'Action: %s\n' "$action"
      printf 'Tag commit: %s\n' "$tag_commit"
      printf 'Artifact: %s\n' "$artifact"
      printf 'Bytes: %s\n' "$(stat -f '%z' "$artifact")"
      printf 'SHA-256: %s\n' "$(awk '{print $1}' "$checksum")"

  - name: "Publish and verify release artifact"
    command: |
      set -euo pipefail

      action="${TANGLED_INPUT_ACTION:-}"
      version="${TANGLED_INPUT_VERSION:-}"
      if [[ "$action" == "verify" ]]; then
        echo "Artifact publication skipped in verify mode."
        exit 0
      fi
      test "$action" = "publish"
      test "${TNG_AUTH_AGENT:-}" = "vsock://host:10241"
      test -z "${TNG_SESSION_FILE:-}"

      repository="nnabeyang.tngl.sh/swift-tangled"
      repository_did="did:plc:5lkgngawfsd5jh7ch5h5ir2v"
      artifact_name="tng-$version-macos-arm64.tar.gz"
      artifact=".build/releases/$version/$artifact_name"
      checksum="$artifact.sha256"
      tag_object="$(git rev-parse "$version^{tag}")"
      publisher_directory="$(mktemp -d)"
      download_directory="$(mktemp -d)"
      trap 'rm -rf "$publisher_directory" "$download_directory"' EXIT

      tar -xzf "$artifact" -C "$publisher_directory" tng
      "$publisher_directory/tng" auth status

      expected_sha="$(awk '{print $1}' "$checksum")"
      upload_json="$download_directory/upload.json"
      artifact_uri=""
      artifact_cid=""

      validate_upload_result() {
        test "$(plutil -extract schemaVersion raw -o - "$upload_json")" = "1"
        test "$(plutil -extract result.value.name raw -o - "$upload_json")" = "$artifact_name"
        test "$(plutil -extract result.value.repositoryDID raw -o - "$upload_json")" = "$repository_did"
        test "$(plutil -extract result.value.tagObjectHash raw -o - "$upload_json")" = "$tag_object"
        artifact_uri="$(plutil -extract result.uri raw -o - "$upload_json")"
        artifact_cid="$(plutil -extract result.cid raw -o - "$upload_json")"
      }

      find_existing_artifact() {
        local view_json="$1"
        for index in $(seq 0 99); do
          local name tag_hash
          name="$(plutil -extract "result.artifacts.$index.value.name" raw -o - "$view_json" 2>/dev/null || true)"
          tag_hash="$(plutil -extract "result.artifacts.$index.value.tagObjectHash" raw -o - "$view_json" 2>/dev/null || true)"
          if [[ "$name" == "$artifact_name" && "$tag_hash" == "$tag_object" ]]; then
            artifact_uri="$(plutil -extract "result.artifacts.$index.uri" raw -o - "$view_json")"
            artifact_cid="$(plutil -extract "result.artifacts.$index.cid" raw -o - "$view_json")"
            return 0
          fi
        done
        return 1
      }

      upload_succeeded=false
      for attempt in 1 2 3; do
        printf 'Artifact upload attempt %s/3\n' "$attempt"
        if "$publisher_directory/tng" artifact upload \
          "$version" \
          "$artifact" \
          --repo "$repository" \
          --name "$artifact_name" \
          --content-type application/gzip \
          --json >"$upload_json" \
          && validate_upload_result
        then
          upload_succeeded=true
          break
        fi

        view_json="$download_directory/view-$attempt.json"
        if ! "$publisher_directory/tng" artifact view \
          "$version" \
          --repo "$repository" \
          --json >"$view_json"
        then
          echo "Artifact inspection failed; refusing to retry upload." >&2
          exit 1
        fi
        test "$(plutil -extract schemaVersion raw -o - "$view_json")" = "1"

        if find_existing_artifact "$view_json"; then
          probe="$download_directory/probe-$attempt"
          if ! "$publisher_directory/tng" artifact download \
            "$version" \
            "$artifact_name" \
            --repo "$repository" \
            --output "$probe" \
            --json
          then
            echo "Published artifact could not be downloaded; refusing to retry upload." >&2
            exit 1
          fi
          probe_sha="$(shasum -a 256 "$probe" | awk '{print $1}')"
          if [[ "$probe_sha" == "$expected_sha" ]]; then
            echo "Matching artifact is already published; continuing without another upload."
            upload_succeeded=true
            break
          fi
          echo "Published artifact has a different SHA-256; refusing to replace it." >&2
          exit 1
        fi

        if [[ "$attempt" != 3 ]]; then
          sleep $((attempt * 2))
        fi
      done
      test "$upload_succeeded" = true
      printf 'Artifact URI: %s\n' "$artifact_uri"
      printf 'Artifact CID: %s\n' "$artifact_cid"

      downloaded="$download_directory/$artifact_name"
      "$publisher_directory/tng" artifact download \
        "$version" \
        "$artifact_name" \
        --repo "$repository" \
        --output "$downloaded" \
        --json

      actual_sha="$(shasum -a 256 "$downloaded" | awk '{print $1}')"
      test "$actual_sha" = "$expected_sha"

      extracted="$download_directory/extracted"
      mkdir -p "$extracted"
      tar -xzf "$downloaded" -C "$extracted"
      test -x "$extracted/tng"
      test -f "$extracted/LICENSE"
      test -f "$extracted/THIRD_PARTY_NOTICES.md"
      find "$extracted/LICENSES" -type f -print -quit | grep -q .
      test "$("$extracted/tng" --version)" = "$version"
      file "$extracted/tng" | grep -q "Mach-O 64-bit executable arm64"
      xcrun vtool -show-build "$extracted/tng" | grep -Eq 'minos 15(\.0+)?$'
      codesign --verify --strict "$extracted/tng"
      printf 'Published SHA-256: %s\n' "$actual_sha"
