name: macOS

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Xcode 26.5)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test
        run: |
          xcodebuild clean test \
            -scheme swift-tangled-Package \
            -destination "platform=macOS" \
            | xcpretty
